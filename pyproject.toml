[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-cost"
version = "0.1.0"
description = "Read a finished agent session and explain where the tokens and money went, including runaway loops. No proxy, no setup."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Salman Ahsan (RBL)" }]
keywords = ["ai-agents", "claude-code", "finops", "cost", "observability", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/0xelitesystem/agent-cost"
Issues = "https://github.com/0xelitesystem/agent-cost/issues"

[project.scripts]
agent-cost = "agent_cost.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
